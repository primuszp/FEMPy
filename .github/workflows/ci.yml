name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Gmsh runtime
        run: sudo apt-get update && sudo apt-get install --yes libglu1-mesa
      - name: Install
        run: python -m pip install -e ".[dev,gmsh]"
      - name: Lint
        run: python -m ruff check fempy tests examples
      - name: Format check
        run: python -m ruff format --check fempy tests examples
      - name: Tests and classical benchmarks
        run: python -m pytest
      - name: Build package
        run: python -m build
